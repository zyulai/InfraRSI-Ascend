# Public-spec supplement to the repository extraction.
#
# The kernel repositories state architecture-level facts (on-chip memories,
# arch ids, core ratios) but not every SKU's memory size or TFLOPS.  This file
# fills only those gaps, and every value carries the public source it came from.
# It never overrides a non-derived value extracted from the repositories; it
# does override a value the model *derived* from a formula when a vendor or
# measured figure exists.
#
# Confidence: high = vendor/product table; medium = two independent public
# sources agree; low = one secondary source or a family-level figure.

